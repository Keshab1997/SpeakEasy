name: Publish Android Release

on:
  workflow_dispatch:
    inputs:
      draft:
        description: Create the GitHub Release as a draft?
        required: true
        type: boolean
        default: false
      prerelease:
        description: Mark this as a prerelease?
        required: true
        type: boolean
        default: false
      upload_to_play_internal:
        description: Also upload the signed AAB to Google Play Internal testing?
        required: false
        type: boolean
        default: false
      package_name:
        description: Play package name override (leave blank to read applicationId from android/app/build.gradle)
        required: false
        type: string
        default: ""

permissions:
  contents: write

jobs:
  publish:
    uses: Keshab1997/flutter-builder/.github/workflows/flutter-build.yml@v1.15.2
    with:
      flutter-channel: stable
      # Release publishing focuses on producing the signed Android files.
      # Formatting, analysis, and tests can run in separate CI workflows.
      run-format-check: false
      run-analyze: false
      run-tests: false
      build-apk: true
      build-aab: true
      artifact-retention-days: 30
      publish-github-release: true
      release-name: SpeakEasy
      release-draft: ${{ inputs.draft }}
      release-prerelease: ${{ inputs.prerelease }}
      # Google Play upload: off unless the run asks for it. Empty play-track
      # disables the upload entirely, so the default run behaves exactly as
      # before. Release notes come from distribution/whatsnew/whatsnew-<locale>
      # (en-US + bn-BD, each under Play's 500-character limit); the builder
      # checks that directory *before* the AAB reaches Play, because after the
      # upload the version code is spent and the build cannot be reused.
      play-track: ${{ inputs.upload_to_play_internal && 'internal' || '' }}
      play-package-name: ${{ inputs.package_name }}
      play-whats-new-directory: ${{ inputs.upload_to_play_internal && 'distribution/whatsnew' || '' }}
      play-status: completed
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
