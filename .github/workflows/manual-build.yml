name: Manual Android Build

on:
  workflow_dispatch:
    inputs:
      format:
        description: Which Android release file should be built?
        required: true
        type: choice
        options:
          - apk
          - aab
        default: apk

permissions:
  contents: read

jobs:
  build:
    uses: Keshab1997/flutter-builder/.github/workflows/flutter-build.yml@v1.1.0
    with:
      flutter-channel: stable
      # Manual release builds should not be blocked by existing formatting,
      # analyzer, or test issues. Validation can run in a separate CI workflow.
      run-format-check: false
      run-analyze: false
      run-tests: false
      build-apk: ${{ inputs.format == 'apk' }}
      build-aab: ${{ inputs.format == 'aab' }}
      artifact-retention-days: 14
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
