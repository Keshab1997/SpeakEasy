org.gradle.jvmargs=-Xmx4G
android.useAndroidX=true
android.enableJetifier=true
# Keep the legacy AGP DSL and Kotlin Gradle Plugin while using AGP 8.x.
android.newDsl=false
android.builtInKotlin=false

# R8: full mode + optimized resource shrinking (AGP 8.12+; default in AGP 9).
# Fixes Play Console "low shrink/obfuscate/optimize" and "optimized resource shrinking isn't enabled".
android.enableR8.fullMode=true
android.r8.optimizedResourceShrinking=true
